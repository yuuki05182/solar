<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>太陽・地球・月</title>

<style>
body{
    margin:0;
    background:#000;
}

canvas{
    display:block;
    margin:auto;
    background:#000;
}
</style>

</head>
<body>

<canvas id="space" width="800" height="600"></canvas>

<script>

const canvas = document.getElementById("space");
const ctx = canvas.getContext("2d");

// 太陽の位置
const sunX = canvas.width / 2;
const sunY = canvas.height / 2;

// ★追加
let astroData = null;

async function loadData() {
    alert("loadData開始");

    try {
        const res = await fetch("https://astro-proxy.y-imamine43.workers.dev/astro");
        alert("fetch成功");

        astroData = await res.json();
        alert("JSON取得成功");

        console.log(astroData);

        const earth = astroData.objects.find(o => o.type === "Earth");
        console.log(earth);

    } catch(e) {
        alert(e);
    }
}

// 太陽を描く
ctx.fillStyle = "yellow";
ctx.beginPath();
ctx.arc(sunX, sunY, 30, 0, Math.PI * 2);
ctx.fill();

// 地球の軌道
ctx.strokeStyle = "gray";
ctx.beginPath();
ctx.arc(sunX, sunY, 220, 0, Math.PI * 2);
ctx.stroke();

// 地球（仮）
const earthOrbit = 220;
const earthAngle = 0;

const earthX = sunX + Math.cos(earthAngle) * earthOrbit;
const earthY = sunY + Math.sin(earthAngle) * earthOrbit;

ctx.fillStyle = "deepskyblue";
ctx.beginPath();
ctx.arc(earthX, earthY, 15, 0, Math.PI * 2);
ctx.fill();

// 月の軌道
ctx.strokeStyle = "#666";
ctx.lineWidth = 1;
ctx.beginPath();
ctx.arc(earthX, earthY, 40, 0, Math.PI * 2);
ctx.stroke();

// 月（仮）
const moonOrbit = 40;
const moonAngle = 0;

const moonX = earthX + Math.cos(moonAngle) * moonOrbit;
const moonY = earthY + Math.sin(moonAngle) * moonOrbit;

ctx.fillStyle = "white";
ctx.beginPath();
ctx.arc(moonX, moonY, 8, 0, Math.PI * 2);
ctx.fill();

loadData();

</script>

</body>
</html>
